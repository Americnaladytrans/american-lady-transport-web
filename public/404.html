<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>American Lady Transport</title>
    <!--
      GitHub Pages SPA fallback. Captures the requested path and redirects
      back to /?/<path> on the root, which index.html decodes back into a
      proper React Router URL. Standard rafgraph/spa-github-pages technique.

      pathSegmentsToKeep = 1 because the site is served from
      /american-lady-transport-web/. For a user/org page or custom domain
      served at root, set this to 0.
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
