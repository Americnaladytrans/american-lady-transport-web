name: Weekly Freight Report

on:
  schedule:
    # 17:00 UTC = noon CDT every Friday
    - cron: "0 17 * * FRI"
  workflow_dispatch:

# Required for: commit JSON back to repo (contents), deploy Pages (pages, id-token)
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deploy at a time. Industry roundup is staggered 30 min later
# so the two Friday workflows do not race on git push or Pages deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  post-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate article, post to Supabase, update JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/weekly-report.mjs

      - name: Commit JSON update
        run: |
          if [[ -n "$(git status --porcelain src/data/blog-posts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/blog-posts.json
            git commit -m "chore(blog): add Weekly Freight Report ($(date -u +%Y-%m-%d))"
            # Retry push in case industry-roundup pushed concurrently.
            # 6 attempts, jittered backoff (handles GitHub's flaky concurrency lock).
            for i in 1 2 3 4 5 6; do
              if git push; then break; fi
              echo "Push attempt $i failed, pulling latest and retrying..."
              git fetch origin main
              git pull --rebase origin main || git rebase --abort
              sleep $((10 + RANDOM % 10))
            done
          else
            echo "No JSON changes to commit."
          fi

      - name: Build static site
        env:
          # Asset base path for GitHub Pages project site
          VITE_BASE: /american-lady-transport-web/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
