name: Industry News Roundup

on:
  schedule:
    # 17:30 UTC = 12:30 PM CDT every Friday
    # Staggered 30 minutes after Weekly Freight Report so the two
    # workflows do not race on git push or Pages deploy.
    - cron: "30 17 * * FRI"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  post-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test blog storage and safety
        run: node --test scripts/lib/*.test.mjs

      - name: Install build-time renderer
        run: npx playwright install --with-deps chromium

      - name: Generate roundup and update authoritative JSON
        env:
          BLOG_STORAGE_MODE: json
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/industry-roundup.mjs

      - name: Commit JSON update
        run: |
          if [[ -n "$(git status --porcelain src/data/blog-posts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/blog-posts.json
            git commit -m "chore(blog): add Industry News Roundup ($(date -u +%Y-%m-%d))"
            # Retry push in case weekly-report pushed concurrently.
            # 6 attempts, jittered backoff (handles GitHub's flaky concurrency lock).
            pushed=false
            for i in 1 2 3 4 5 6; do
              if git push; then pushed=true; break; fi
              echo "Push attempt $i failed, pulling latest and retrying..."
              git fetch origin main
              git pull --rebase origin main || git rebase --abort
              sleep $((10 + RANDOM % 10))
            done
            if [[ "$pushed" != true ]]; then echo "::error::Failed to preserve article in GitHub"; exit 1; fi
          else
            echo "No JSON changes to commit."
          fi

      - name: Build canonical usealt.com release
        env:
          VITE_BASE: /
        run: |
          npm run build
          node scripts/write-release-manifest.mjs

      - name: Save canonical release for Cloudflare publishing
        uses: actions/upload-artifact@v4
        with:
          name: usealt-production
          path: dist/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Build static site
        env:
          # Asset base path for GitHub Pages project site
          VITE_BASE: /american-lady-transport-web/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
